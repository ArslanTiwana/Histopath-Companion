services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: histopath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - histopath_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d histopath"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/histopath
    depends_on:
      db:
        condition: service_healthy

volumes:
  histopath_data:
